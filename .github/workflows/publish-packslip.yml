name: "Publish packslip"

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions: {}

jobs:
  publish:
    name: Sign packslip
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For signing the packslip with this workflow's identity.
      id-token: write
    steps:
      - name: Fetch binary archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-*
          path: artifacts/
          merge-multiple: true
      # A packslip is a signed list of the release archives, their digests, the
      # executable inside each one, and the completions and skill for this
      # version, so installers can verify a download against this repository's
      # workflow identity. Releases are immutable once published, so the bundle
      # is handed to `announce` as an artifact instead of uploaded afterwards.
      # `announce` attests every archive, which is why `attest: link` is enough.
      # See https://packslip.dev.
      - uses: jdx/packslip@4920350c39c234c7a969f9775040bd02829f1923 # v1.3.0
        with:
          tag: ${{ fromJson(inputs.plan).announcement_tag }}
          artifacts: artifacts/prek-*.tar.gz artifacts/prek-*.zip
          bin: prek
          resources: |
            completion/bash,zsh,fish,powershell,elvish=exec:prek util generate-shell-completion {shell}
            skill/prek=repo:skills/prek
          attest: link
          upload: false
      - name: Upload packslip
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-packslip
          path: packslip/packslip.sigstore.json
